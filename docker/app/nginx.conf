server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # These must always be fresh: the service worker so updates are noticed, the config so a changed
  # RELAY_URL takes effect on the next launch, the manifest so installs see changes.
  location ~ ^/(sw\.js|workbox-.*\.js|config\.json|manifest\.webmanifest|registerSW\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # The app has no client-side router, so there are no deep links to rewrite.
  location / {
    try_files $uri /index.html;
  }
}
